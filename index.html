<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link
      href="https://fonts.googleapis.com/css?family=Material+Icons|Raleway|Satisfy"
      rel="stylesheet"
    />
    <link
      href="https://use.fontawesome.com/releases/v5.1.0/css/all.css"
      integrity="sha384-lKuwvrZot6UHsBSfcMvOkWwlCMgc0TaWr+30HWe3a4ltaBwTZhyTEggF5tJv8tbt"
      crossorigin="anonymous"
      rel="stylesheet"
    />

    <script defer data-domain="pause.crystalprism.io" src="https://plausible.crystalprism.io/js/script.js"></script>
    <script>
      // Tells flare's daily visits email this visit is a signed-in person's.
      window.plausible = window.plausible || function () { (window.plausible.q = window.plausible.q || []).push(arguments); };
      fetch('/api/me').then(function (r) { return r.ok ? r.json() : null; }).then(function (me) {
        if (me && me.state !== 'signed-out') window.plausible('signed_in', { props: { signed_in: '1' }, interactive: false });
      }).catch(function () {});
    </script>

    <title>Pause</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <div id="footer"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
